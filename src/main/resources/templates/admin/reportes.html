<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reportes Globales | Turnosmart Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, rgba(248, 250, 252, 0.88) 0%, rgba(248, 250, 252, 0.95) 100%), url('/background.jpg') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Inter', sans-serif;
        }
        .main-content { padding: 2rem; }
        .chart-container {
            border: 1px solid rgba(226, 232, 240, 0.8);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.98);
            padding: 1.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            backdrop-filter: blur(8px);
            margin-bottom: 2rem;
        }
        .stat-card {
            border: 1px solid rgba(226, 232, 240, 0.8);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.98);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            backdrop-filter: blur(8px);
        }
        .navbar-custom {
            background-color: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            padding: 0.75rem 0;
        }
        .navbar-custom .nav-link {
            padding: 0.5rem 1rem;
            border-radius: 10px;
            transition: all 0.2s ease;
        }
        .navbar-custom .nav-link:hover {
            background-color: #f1f5f9;
        }
        .navbar-custom .nav-link.active {
            background-color: #eff6ff;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-custom shadow-sm sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold text-primary d-flex align-items-center me-4" th:href="@{/admin/dashboard}">
            <i class="bi bi-shield-check-fill me-2"></i> Turnosmart <span class="badge bg-primary ms-2" style="font-size: 0.55em; vertical-align: middle;">ADMIN</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAdmin" aria-controls="navbarNavAdmin" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavAdmin">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-1">
                <li class="nav-item">
                    <a class="nav-link fw-semibold text-dark" th:href="@{/admin/dashboard}"><i class="bi bi-speedometer2 me-1"></i> Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link fw-semibold text-dark" th:href="@{/admin/usuarios}"><i class="bi bi-people me-1"></i> Gestión Clientes</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link fw-semibold text-dark" th:href="@{/admin/abogados}"><i class="bi bi-person-workspace me-1"></i> Gestión Abogados</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link fw-semibold active text-primary" th:href="@{/admin/reportes}"><i class="bi bi-bar-chart-line me-1"></i> Reportes Globales</a>
                </li>
            </ul>
        </div>
        <div class="d-flex align-items-center gap-3">
            <div class="text-end d-none d-md-block">
                <p class="mb-0 small fw-bold" th:text="${session.loggedUser.firstName + ' ' + session.loggedUser.lastName}">Nombre Admin</p>
                <p class="mb-0 x-small text-muted" style="font-size: 0.7rem;">Administrador Principal</p>
            </div>

            <a th:href="@{/logout}" class="btn btn-outline-danger btn-sm rounded-pill px-3 fw-semibold shadow-sm d-flex align-items-center gap-1">
                <i class="bi bi-box-arrow-right"></i> <span>Salir</span>
            </a>

            <div>
                <img th:src="'https://ui-avatars.com/api/?name=' + ${session.loggedUser.firstName} + '&background=2563eb&color=fff&bold=true'"
                     class="rounded-circle border border-2 border-white shadow-sm" width="44" alt="Avatar">
            </div>
        </div>
    </div>
</nav>

<div class="container py-5">
    <h2 class="fw-bold mb-4">Reportes Globales</h2>

    <!-- Fila de Indicadores -->
    <div class="row g-4 mb-4">
        <div class="col-md-3">
            <div class="card stat-card p-3 border-start border-primary border-5">
                <span class="text-muted small fw-bold">TOTAL TRÁMITES</span>
                <h2 class="fw-bold mb-0" th:text="${totalTramites ?: 0}">0</h2>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card stat-card p-3 border-start border-success border-5">
                <span class="text-muted small fw-bold">RECAUDACIÓN</span>
                <h2 class="fw-bold mb-0 text-success" th:text="'S/ ' + ${recaudacionTotal ?: 0}">S/ 0</h2>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-md-6">
            <div class="chart-container">
                <h5 class="fw-bold mb-4">Distribución por Estados</h5>
                <canvas id="statusChart"></canvas>
            </div>
        </div>
        <div class="col-md-6">
            <div class="chart-container">
                <h5 class="fw-bold mb-4">Trámites más Solicitados</h5>
                <canvas id="typesChart"></canvas>
            </div>
        </div>
    </div>
</div>

<!-- EL TRUCO PARA THYMELEAF ESTÁ AQUÍ -->
<script th:inline="javascript">
    /*<![CDATA[*/

    // 1. Gráfico de Estados
    const ctxStatus = document.getElementById('statusChart').getContext('2d');
    new Chart(ctxStatus, {
        type: 'doughnut',
        data: {
            labels: ['Pendientes', 'En Proceso', 'Finalizados', 'Cancelados'],
            datasets: [{
                // Inyectamos valores de Spring; si son nulos, ponemos 0
                data: [
                    /*[[${countPendientes ?: 0}]]*/ 0,
                    /*[[${countProceso ?: 0}]]*/ 0,
                    /*[[${countFinalizados ?: 0}]]*/ 0,
                    /*[[${countCancelados ?: 0}]]*/ 0
                ],
                backgroundColor: ['#f59e0b', '#3b82f6', '#10b981', '#ef4444']
            }]
        }
    });

    // 2. Gráfico de Tipos de Trámite
    const ctxTypes = document.getElementById('typesChart').getContext('2d');

    // Usamos comentarios de Thymeleaf para que el JS sea válido incluso si falla la inyección
    const nombresLabels = /*[[${nombresTramites}]]*/ ['Sin datos'];
    const cantidadesData = /*[[${cantidadesTramites}]]*/ [0];

    new Chart(ctxTypes, {
        type: 'bar',
        data: {
            labels: nombresLabels,
            datasets: [{
                label: 'Cantidad',
                data: cantidadesData,
                backgroundColor: '#6366f1'
            }]
        }
    });

    /*]]>*/
</script>

</body>
</html>
